<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Toos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2e6b4f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* The password-reset page, for the app and the admin page alike.
     Arriving from the link in a "Reset your password" email, Supabase has put a
     one-hour recovery session in the fragment (#access_token=…&type=recovery);
     supabase-js picks it up and the page asks for the new password. Arriving
     any other way (typed address, expired link), it offers to send the email.
     The request never says whether an account exists for the address. Text
     only, never HTML from the URL.
     The new password has to meet the same rules as sign-up in the app: at
     least 8 characters, a letter and a number, not the account's email, and
     not one exposed in a known data breach (checked anonymously against
     Have I Been Pwned). The project setting enforces the first two server-side. */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  body > main { flex: 1 0 auto; }
  .rp { max-width: 36rem; padding-top: 32px; padding-bottom: 80px; }
  .rp .sheet { padding: 26px 24px 28px; }
  .rp h2 { font: 700 clamp(28px, 5vw, 36px)/1.1 var(--serif); margin: 0 0 14px; text-wrap: balance; }
  .rp p { margin: 0 0 12px; font-size: 18px; line-height: 1.55; }
  .rp .state { color: var(--muted); }
  .rp .error { color: var(--red); font-weight: 600; }
  .rp .ok { color: var(--green); font-weight: 600; }
  .rp form { display: grid; gap: 14px; margin-top: 6px; }
  .rp label { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
  .rp input[type=email], .rp input[type=password], .rp input[type=text] {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px; font: inherit; font-size: 17px;
    background: var(--sheet); color: var(--ink); min-width: 0;
  }
  .rp label.row { grid-auto-flow: column; justify-content: start; align-items: center; gap: 8px; font-size: 15px; }
  .rp ul.rules { list-style: none; margin: -6px 0 0; padding: 0 0 0 2px; display: grid; gap: 3px; font-size: 15px; color: var(--muted); }
  .rp ul.rules li::before { content: "○"; display: inline-block; width: 1.3em; }
  .rp ul.rules li.met { color: var(--green); }
  .rp ul.rules li.met::before { content: "✓"; }
  .rp .button { min-height: 44px; padding: 8px 20px; font: inherit; font-weight: 600; cursor: pointer; border: 1.5px solid var(--cover); justify-self: start; }
  .rp .button[disabled] { opacity: 0.6; cursor: progress; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="cover-band">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><svg class="mark" viewBox="14 14 80 80" aria-hidden="true"><circle cx="54" cy="54" r="40" fill="#2e6b4f"/><g fill="#fff"><rect x="40" y="30" width="6" height="48" rx="3"/><rect x="50" y="30" width="6" height="48" rx="3"/><rect x="60" y="30" width="6" height="48" rx="3"/><rect x="34" y="30" width="38" height="8" rx="4"/></g></svg><span>Toos</span></a>
    </div>
  </header>
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">Your account</p>
      <h1>Toos</h1>
    </div>
  </section>
</div>

<main id="main" class="wrap rp">
  <div class="sheet" id="panel" aria-live="polite">
    <h2>Reset your password</h2>
    <p class="state">Checking your link…</p>
  </div>
</main>

<footer class="foot cover-band">
  <div class="wrap">
    <p>© 2026 Toos The Place Store.</p>
    <nav aria-label="Footer"><a href="index.html">Home</a><a href="privacy.html">Privacy policy</a></nav>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://mfzolfevciyqftbvwhot.supabase.co";
  var PUBLISHABLE_KEY = "sb_publishable_VspZiBu84U3hVSCk2ORBaQ_XEz3Iv-b"; // the app's public key, same as the phone app carries
  var HERE = "https://toostheplace.com/reset-password.html";
  var MIN_LENGTH = 8;  // the project's setting, and the app's sign-up check
  var MAX_LENGTH = 72; // bcrypt's ceiling, which the server enforces
  var panel = document.getElementById("panel");
  var knownEmail = ""; // the account's address, once the recovery session is live

  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") node.textContent = props[k];
      else if (k === "className") node.className = props[k];
      else if (k === "required" || k === "disabled") node[k] = !!props[k];
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function show() { panel.replaceChildren.apply(panel, Array.prototype.slice.call(arguments).filter(Boolean)); }

  // ── the rules ──────────────────────────────────────────────────────────────
  // The same three the app applies at sign-up (PasswordPolicy.kt). The letter
  // set is ASCII because the server's is.
  function containsEmail(p) {
    var address = knownEmail.trim().toLowerCase();
    if (!address) return false;
    var lower = p.toLowerCase();
    var local = address.split("@")[0];
    return lower.indexOf(address) >= 0 || (local.length >= 4 && lower.indexOf(local) >= 0);
  }
  var RULES = [
    { text: "At least " + MIN_LENGTH + " characters", ok: function (p) { return p.length >= MIN_LENGTH; } },
    { text: "A letter and a number", ok: function (p) { return /[A-Za-z]/.test(p) && /[0-9]/.test(p); } },
    { text: "Not your email address", ok: function (p) { return !containsEmail(p); } },
  ];
  function unmet(p) { return RULES.filter(function (r) { return !r.ok(p); }); }

  // Have I Been Pwned's range check. Only the first five hex characters of the
  // password's SHA-1 leave the browser (the reply lists every suffix in that
  // range, padded so the match can't be told from the size); the password
  // itself never does. Resolves true/false, or null when the check couldn't
  // run — then the save goes ahead rather than blocking on someone else's outage.
  function isLeaked(p) {
    if (!(window.crypto && crypto.subtle && window.fetch && window.TextEncoder)) return Promise.resolve(null);
    return crypto.subtle.digest("SHA-1", new TextEncoder().encode(p)).then(function (buf) {
      var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("").toUpperCase();
      var ctrl = typeof AbortController === "function" ? new AbortController() : null;
      if (ctrl) setTimeout(function () { ctrl.abort(); }, 8000);
      return fetch("https://api.pwnedpasswords.com/range/" + hex.slice(0, 5), { headers: { "Add-Padding": "true" }, signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (body) {
          if (body === null) return null;
          var suffix = hex.slice(5);
          var lines = body.split(/\r?\n/);
          for (var i = 0; i < lines.length; i++) {
            var parts = lines[i].trim().split(":");
            if (parts[0].toUpperCase() === suffix) return parseInt(parts[1], 10) > 0;
          }
          return false;
        });
    }).catch(function () { return null; });
  }

  // Read the fragment before supabase-js consumes it: a failed link carries
  // #error=access_denied&error_code=otp_expired&error_description=…
  var params = new URLSearchParams(location.hash.replace(/^#/, ""));
  var linkError = params.get("error_code") || params.get("error") || "";
  var linkErrorText = (params.get("error_description") || "").replace(/\+/g, " ");
  var fromEmail = params.get("type") === "recovery" && !!params.get("access_token");

  if (!window.supabase) {
    show(el("h2", { text: "Reset your password" }), el("p", { className: "error", text: "Could not load this page's sign-in library. Check the connection and reload." }));
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY, { auth: { persistSession: false, detectSessionInUrl: true } });

  // Step 1: ask for the email. Same answer whether or not the account exists.
  function requestForm(intro, introIsError) {
    var email = el("input", { type: "email", name: "email", autocomplete: "email", required: true });
    var button = el("button", { type: "submit", className: "button", text: "Email me a reset link" });
    var note = el("p", { className: introIsError ? "error" : "state", text: intro });
    var form = el("form", {}, [el("label", {}, ["Your account's email", email]), button]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      button.disabled = true;
      button.textContent = "Sending…";
      sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: HERE }).then(function (r) {
        if (r.error && /rate|too many|seconds/i.test(r.error.message || "")) {
          button.disabled = false;
          button.textContent = "Email me a reset link";
          note.className = "error";
          note.textContent = "Too many emails just now. Wait a minute and try again.";
          return;
        }
        show(
          el("h2", { text: "Check your email" }),
          el("p", { text: "If a Toos account uses " + email.value.trim() + ", we've sent it a link to choose a new password. It works once, for an hour." }),
          el("p", { className: "state", text: "Nothing after a few minutes? Look in spam, or check the address and try again." })
        );
      });
    });
    show(el("h2", { text: "Forgot your password?" }), note, form);
  }

  // Step 2: the recovery session is live; choose the new password.
  function newPasswordForm() {
    var pw = el("input", { type: "password", name: "password", autocomplete: "new-password", minlength: String(MIN_LENGTH), maxlength: String(MAX_LENGTH), required: true });
    var again = el("input", { type: "password", name: "again", autocomplete: "new-password", maxlength: String(MAX_LENGTH), required: true });
    var reveal = el("input", { type: "checkbox" });
    reveal.addEventListener("change", function () { pw.type = again.type = reveal.checked ? "text" : "password"; });
    // The rules, ticked off as they type, so a refused save is never a surprise.
    var rules = el("ul", { className: "rules", "aria-label": "Password rules" }, RULES.map(function (r) { return el("li", { text: r.text }); }));
    pw.addEventListener("input", function () {
      var missing = unmet(pw.value);
      RULES.forEach(function (r, i) { rules.children[i].className = pw.value && missing.indexOf(r) < 0 ? "met" : ""; });
    });
    var button = el("button", { type: "submit", className: "button", text: "Save new password" });
    var note = el("p", { className: "state", text: "Pick one you don't use anywhere else. We also check it against passwords exposed in known data breaches." });
    var form = el("form", {}, [
      el("label", {}, ["New password", pw]),
      rules,
      el("label", {}, ["Type it again", again]),
      el("label", { className: "row" }, [reveal, "Show passwords"]),
      button,
    ]);
    function fail(text) {
      button.disabled = false;
      button.textContent = "Save new password";
      note.className = "error";
      note.textContent = text;
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var p = pw.value;
      var missing = unmet(p);
      if (p.length > MAX_LENGTH) { fail("Keep it under " + MAX_LENGTH + " characters."); return; }
      if (missing.length) { fail("Not yet: " + missing.map(function (r) { return r.text.toLowerCase(); }).join(", ") + "."); return; }
      if (p !== again.value) { fail("The two passwords don't match."); return; }
      button.disabled = true;
      button.textContent = "Checking…";
      isLeaked(p).then(function (leaked) {
        if (leaked) { fail("That password has shown up in a data breach, so it isn't safe to use. Choose a different one."); return; }
        button.textContent = "Saving…";
        return sb.auth.updateUser({ password: p }).then(function (r) {
          if (r.error) {
            var m = r.error.message || "";
            if (/session|expired|jwt/i.test(m)) { requestForm("This link has expired. Ask for a new one.", true); return; }
            fail(/different from the old/i.test(m) ? "That's your current password. Choose a different one."
              : /known to be weak|easy to guess|pwned/i.test(m) ? "That password has shown up in a data breach. Choose a different one."
              : /weak|at least|should contain/i.test(m) ? "Not strong enough yet: at least " + MIN_LENGTH + " characters, with a letter and a number."
              : m);
            return;
          }
          sb.auth.signOut({ scope: "local" });
          show(
            el("h2", { text: "Password changed" }),
            el("p", { className: "ok", text: "Your new password is saved." }),
            el("p", { text: "Go back to the Toos app (or the admin page) and sign in with it. You can close this page." })
          );
        });
      });
    });
    show(el("h2", { text: "Choose a new password" }), note, form);
  }

  // Only drop the fragment when it holds no session: supabase-js reads the
  // recovery token from it asynchronously, and clears it itself once read.
  if (!fromEmail && location.hash) history.replaceState(null, "", location.pathname);

  if (linkError) {
    requestForm(linkError === "otp_expired"
      ? "That link has expired or was already used. Links work once, for an hour. Ask for a new one."
      : (linkErrorText || "That link didn't work.") + " Ask for a new one.", true);
    return;
  }
  if (!fromEmail) { requestForm("Enter your account's email and we'll send you a link to choose a new one."); return; }

  // supabase-js turns the fragment into a session on start; wait for it.
  var settled = false;
  function ready(session) {
    settled = true;
    knownEmail = (session && session.user && session.user.email) || "";
    newPasswordForm();
  }
  sb.auth.onAuthStateChange(function (event, session) {
    if (settled) return;
    if (session && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) ready(session);
  });
  sb.auth.getSession().then(function (r) {
    if (location.hash) history.replaceState(null, "", location.pathname);
    if (settled) return;
    if (r.data && r.data.session) { ready(r.data.session); return; }
    setTimeout(function () {
      if (settled) return;
      settled = true;
      requestForm("That link didn't work. It may have expired. Ask for a new one.", true);
    }, 3000);
  });
})();
</script>
</body>
</html>
