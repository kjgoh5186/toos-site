<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Toos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2e6b4f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* Admin page. The page itself can do nothing — every action goes to the `admin`
     Edge Function, which checks the session and the admin list before touching
     anything. Text only, never HTML from data. */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  body > main { flex: 1 0 auto; }
  .adm { max-width: 60rem; padding-top: 24px; padding-bottom: 80px; display: grid; gap: 18px; }
  .adm .sheet { padding: 22px 24px 26px; }
  .adm h2 { font: 700 clamp(24px, 4vw, 30px)/1.15 var(--serif); margin: 0 0 12px; text-wrap: balance; }
  .adm h3 { font: 600 20px/1.3 var(--serif); margin: 18px 0 8px; }
  .adm p { margin: 0 0 10px; font-size: 17px; line-height: 1.5; }
  .adm .state { color: var(--muted); }
  .adm .error { color: var(--red); font-weight: 600; }
  .adm .ok { color: var(--green); font-weight: 600; }
  .adm .who { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .adm .who span { color: var(--muted); }
  .adm nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .adm nav.tabs a { text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink); font-size: 15px; font-weight: 600; }
  .adm nav.tabs a.on { background: var(--cover); border-color: var(--cover); color: var(--cream); }
  .adm nav.tabs a .n { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 6px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; text-align: center; }
  .adm form { display: grid; gap: 12px; }
  .adm .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px 16px; }
  .adm .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 10px; margin-bottom: 8px; }
  .adm .tile { border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .adm .tile b { display: block; font: 700 26px/1.1 var(--serif); }
  .adm .tile span { color: var(--muted); font-size: 14px; }
  .adm label { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
  .adm label.row { grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; color: var(--ink); font-size: 16px; }
  .adm input[type=text], .adm input[type=email], .adm input[type=password], .adm input[type=number], .adm input[type=search],
  .adm input[type=datetime-local], .adm select, .adm textarea {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 6px; font: inherit; font-size: 16px;
    background: var(--sheet); color: var(--ink); min-width: 0;
  }
  .adm textarea { min-height: 72px; }
  .adm .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
  .adm .button { min-height: 42px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; border: 1.5px solid var(--cover); }
  .adm .button.quiet { background: transparent; color: var(--cover); }
  .adm .button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .adm .button.small { min-height: 32px; padding: 4px 12px; font-size: 14px; }
  .adm .button[disabled] { opacity: 0.6; cursor: progress; }
  .adm table.data { font-size: 15px; }
  .adm table.data th, .adm table.data td { text-align: left; vertical-align: top; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  .adm table.data th { color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; text-transform: uppercase; }
  .adm table.data tr.sel td { background: var(--cream-muted); }
  .adm table.data tr.click { cursor: pointer; }
  .adm .scroll { overflow-x: auto; }
  .adm .id, .adm .small-muted { color: var(--muted); font-size: 13.5px; }
  .adm code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; background: var(--cream-muted); color: var(--ink); padding: 2px 6px; border-radius: 4px; }
  @media (prefers-color-scheme: dark) { .adm code { background: #2d3a2f; } }
  .adm .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .adm .pill.on { background: var(--cream-muted); color: var(--green); }
  .adm .pill.off { background: var(--line); color: var(--muted); }
  .adm .pill.warn { background: #f6e0d6; color: var(--red); }
  .adm .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .adm .card { padding: 16px 18px 14px; margin-bottom: 12px; }
  .adm .card h4 { margin: 0 0 6px; font: 600 18px/1.3 var(--serif); }
  .adm .card ul { margin: 6px 0 10px; padding-left: 20px; font-size: 15.5px; }
  .adm .panel { border-left: 3px solid var(--cover); padding: 8px 0 4px 14px; margin: 10px 0 6px; }
  .adm .panel.done { border-color: var(--green); }
  .adm label.reason { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px; color: var(--ink); font-size: 15.5px; }
  .adm fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .adm .excerpt { max-width: 28rem; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="cover-band">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><svg class="mark" viewBox="14 14 80 80" aria-hidden="true"><circle cx="54" cy="54" r="40" fill="#2e6b4f"/><g fill="#fff"><rect x="40" y="30" width="6" height="48" rx="3"/><rect x="50" y="30" width="6" height="48" rx="3"/><rect x="60" y="30" width="6" height="48" rx="3"/><rect x="34" y="30" width="38" height="8" rx="4"/></g></svg><span>Toos</span></a>
    </div>
  </header>
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">Admin</p>
      <h1>Toos admin</h1>
    </div>
  </section>
</div>

<main id="main" class="wrap adm">
  <div class="sheet" id="panel" aria-live="polite">
    <p class="state">Loading…</p>
  </div>
</main>

<footer class="foot cover-band">
  <div class="wrap">
    <p>© 2026 Toos The Place Store.</p>
    <nav aria-label="Footer"><a href="index.html">Home</a><a href="privacy.html">Privacy policy</a></nav>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://mfzolfevciyqftbvwhot.supabase.co";
  var PUBLISHABLE_KEY = "sb_publishable_VspZiBu84U3hVSCk2ORBaQ_XEz3Iv-b"; // the app's public key, same as the phone app carries
  var API = SUPABASE_URL + "/functions/v1/admin";
  var ICONS = ["trophy", "star", "flag", "heart", "sparkle"];
  var TABS = [
    ["dashboard", "Dashboard"], ["moderation", "Moderation"], ["members", "Members"], ["listings", "Listings"],
    ["reviews", "Reviews"], ["badges", "Badges"], ["audit", "Audit"], ["admins", "Admins"],
  ];
  var panel = document.getElementById("panel");

  if (!window.supabase) {
    panel.replaceChildren(el("p", { className: "error", text: "Could not load the sign-in library. Check the connection and reload." }));
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY);

  // ── tiny DOM helpers ───────────────────────────────────────────────────────
  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") node.textContent = props[k];
      else if (k === "className") node.className = props[k];
      else if (k === "onClick") node.addEventListener("click", props[k]);
      else if (k === "checked" || k === "disabled" || k === "required" || k === "selected") node[k] = !!props[k];
      else if (k === "value") node.value = props[k];
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function table(headers, rows) {
    return el("div", { className: "scroll" }, [el("table", { className: "data" }, [
      el("thead", {}, [el("tr", {}, headers.map(function (h) { return el("th", { text: h }); }))]),
      el("tbody", {}, rows),
    ])]);
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function fmtTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function pad(n, cap) {
    var width = cap ? String(cap).length : 1;
    var s = String(n);
    while (s.length < width) s = "0" + s;
    return s;
  }
  function badgeLabel(b, number) {
    return b.numbered && number != null ? b.title + " #" + pad(number, b.max_awards) : b.title;
  }
  // Two clicks for anything destructive: the first arms the button, the second acts.
  function armed(label, confirmLabel, onConfirm, danger) {
    var b = el("button", { className: "button quiet small", text: label });
    b.addEventListener("click", function () {
      if (b.textContent !== confirmLabel) { b.textContent = confirmLabel; b.className = "button " + (danger === false ? "" : "danger ") + "small"; return; }
      b.disabled = true;
      onConfirm(b);
    });
    return b;
  }

  // ── API ────────────────────────────────────────────────────────────────────
  function call(body) {
    return sb.auth.getSession().then(function (r) {
      var token = r.data && r.data.session ? r.data.session.access_token : "";
      return fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, "apikey": PUBLISHABLE_KEY },
        body: JSON.stringify(body),
        cache: "no-store",
      });
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "Unexpected answer (HTTP " + r.status + ")" }; })
        .then(function (res) { res.status = r.status; return res; });
    }, function () {
      return { ok: false, error: "Could not reach Toos. Check the connection and try again.", status: 0 };
    });
  }

  // ── sign in ────────────────────────────────────────────────────────────────
  function showLogin(message) {
    document.title = "Admin · Toos";
    var email = el("input", { type: "email", name: "email", autocomplete: "username", required: true });
    var password = el("input", { type: "password", name: "password", autocomplete: "current-password", required: true });
    var button = el("button", { type: "submit", className: "button", text: "Sign in" });
    var note = el("p", { className: message ? "error" : "state", text: message || "Sign in with your Toos account. Only admin accounts get past this page." });
    var form = el("form", {}, [
      el("label", {}, ["Email", email]),
      el("label", {}, ["Password", password]),
      el("div", { className: "actions" }, [button]),
    ]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      button.disabled = true;
      button.textContent = "Signing in…";
      sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value }).then(function (r) {
        if (r.error) {
          button.disabled = false;
          button.textContent = "Sign in";
          note.className = "error";
          var m = r.error.message || "";
          note.textContent = /invalid login/i.test(m) ? "Wrong email or password." : /not confirmed/i.test(m) ? "Confirm your email first: open the link Toos sent you, then sign in." : m;
          return;
        }
        start();
      });
    });
    panel.replaceChildren(el("h2", { text: "Sign in" }), note, form);
  }

  function signOut() { sb.auth.signOut().then(function () { showLogin(); }); }

  // ── app state ──────────────────────────────────────────────────────────────
  var state = { email: "", fixed: false, tab: "dashboard", message: null, open: 0,
    stats: null, moderation: null, members: Object.assign(paged(), { selected: null, detail: null }),
    listings: paged(), reviews: paged(), audit: paged(),
    badges: null, holders: {}, editing: null, admins: null };

  function start() {
    panel.replaceChildren(el("p", { className: "state", text: "Checking your account…" }));
    call({ op: "me" }).then(function (res) {
      if (!res.ok) {
        if (res.status === 401) return showLogin();
        return panel.replaceChildren(
          el("h2", { text: "Not an admin" }),
          el("p", { className: "error", text: res.error || "This account is not an admin." }),
          el("div", { className: "actions" }, [el("button", { className: "button quiet", text: "Sign out", onClick: signOut })])
        );
      }
      state.email = res.data.email;
      state.fixed = !!res.data.fixed;
      var hash = location.hash.replace(/^#/, "");
      state.tab = TABS.some(function (t) { return t[0] === hash; }) ? hash : "dashboard";
      window.addEventListener("hashchange", function () {
        var h = location.hash.replace(/^#/, "");
        if (TABS.some(function (t) { return t[0] === h; }) && h !== state.tab) { state.tab = h; state.message = null; render(); loadTab(); }
      });
      render();
      loadTab();
      refreshOpenCount();
    });
  }

  function refreshOpenCount() {
    return call({ op: "stats" }).then(function (res) {
      if (!res.ok) return;
      state.stats = res.data;
      state.open = (res.data.claims_pending || 0) + (res.data.reports_open || 0) + (res.data.edits_open || 0);
      render();
    });
  }

  function flash(text, isError) { state.message = { text: text, error: !!isError }; render(); }

  function loadTab() {
    var t = state.tab;
    if (t === "dashboard") return refreshOpenCount();
    if (t === "moderation") return call({ op: "moderation.list" }).then(function (res) { if (!res.ok) return flash(res.error, true); state.moderation = res.data; render(); });
    if (t === "members") return listMembers();
    if (t === "badges") return call({ op: "badges.list" }).then(function (res) { if (!res.ok) return flash(res.error, true); state.badges = res.data; render(); });
    if (t === "listings") return loadListings();
    if (t === "reviews") return loadReviews();
    if (t === "audit") return loadAudit();
    if (t === "admins") return call({ op: "admins.list" }).then(function (res) { if (!res.ok) return flash(res.error, true); state.admins = res.data; render(); });
    render();
  }

  // ── render ─────────────────────────────────────────────────────────────────
  function render() {
    var label = TABS.filter(function (t) { return t[0] === state.tab; })[0][1];
    document.title = label + " · Toos admin";
    var header = el("div", { className: "who" }, [
      el("span", { text: "Signed in as " + state.email }),
      el("button", { className: "button quiet small", text: "Sign out", onClick: signOut }),
    ]);
    var nav = el("nav", { className: "tabs" }, TABS.map(function (t) {
      var a = el("a", { href: "#" + t[0], className: t[0] === state.tab ? "on" : "", text: t[1] });
      if (t[0] === "moderation" && state.open) a.appendChild(el("span", { className: "n", text: String(state.open) }));
      return a;
    }));
    var parts = [header, nav];
    if (state.message) parts.push(el("p", { className: state.message.error ? "error" : "ok", text: state.message.text }));
    var views = { dashboard: dashboardView, moderation: moderationView, members: membersView, listings: listingsView,
      reviews: reviewsView, badges: badgesView, audit: auditView, admins: adminsView };
    parts = parts.concat(views[state.tab]());
    panel.replaceChildren.apply(panel, parts);
  }

  // ── dashboard ──────────────────────────────────────────────────────────────
  function dashboardView() {
    var s = state.stats;
    if (!s) return [el("p", { className: "state", text: "Loading…" })];
    var tile = function (n, label) { return el("div", { className: "tile" }, [el("b", { text: String(n) }), el("span", { text: label })]); };
    var tiles = el("div", { className: "tiles" }, [
      tile(s.members, "members (" + s.members_confirmed + " confirmed)"), tile(s.places, "listings shared"), tile(s.reviews, "reviews"),
      tile(s.votes, "helpful votes"), tile(s.saves, "saves"), tile(s.badges_awarded, "badges awarded"),
      tile(state.open, "waiting for a decision"), tile(s.claims_verified, "verified owners"), tile(s.places_closed, "places closed"),
    ]);
    var rows = (s.daily || []).map(function (d) {
      return el("tr", {}, [el("td", { text: fmtDate(d.day) }), el("td", { text: String(d.members) }), el("td", { text: String(d.places) }),
        el("td", { text: String(d.reviews) }), el("td", { text: String(d.votes) }), el("td", { text: String(d.saves) })]);
    });
    return [el("h2", { text: "Dashboard" }), tiles, el("h3", { text: "Last 7 days" }), table(["Day", "New members", "Listings", "Reviews", "Votes", "Saves"], rows)];
  }

  // ── moderation ─────────────────────────────────────────────────────────────
  function moderationView() {
    var m = state.moderation;
    if (!m) return [el("h2", { text: "Moderation" }), el("p", { className: "state", text: "Loading…" })];
    var out = [el("h2", { text: "Moderation" })];
    var total = m.claims.length + m.closures.length + m.edits.length;
    if (!total) out.push(el("p", { className: "ok", text: "Nothing waiting. Everything has been decided." }));
    if (m.claims.length) {
      out.push(el("h3", { text: "Ownership claims (" + m.claims.length + ")" }));
      m.claims.forEach(function (c) { out.push(claimCard(c)); });
    }
    if (m.closures.length) {
      out.push(el("h3", { text: "Reported closed (" + m.closures.length + ")" }));
      m.closures.forEach(function (c) { out.push(closureCard(c)); });
    }
    if (m.edits.length) {
      out.push(el("h3", { text: "Suggested edits (" + m.edits.length + ")" }));
      m.edits.forEach(function (c) { out.push(editCard(c)); });
    }
    return out;
  }
  function placeLine(p, id) { return p.name + (p.address ? ", " + p.address : "") + (p.name === id ? "" : " · " + id); }
  function claimCard(c) {
    var proofs = el("ul", {}, [
      c.document_url ? el("li", {}, [el("a", { href: c.document_url, target: "_blank", rel: "noopener", text: "Business document" })]) : el("li", { text: "No document attached" + (c.note ? " — claimant says: “" + c.note + "”" : "") }),
      c.shopfront_url
        ? el("li", {}, [el("a", { href: c.shopfront_url, target: "_blank", rel: "noopener", text: "Photo at the shop" }), " — " + (c.shopfront_from_gallery ? "chosen from the gallery, so it may be old and its location is unknown" : c.shopfront_distance_m == null ? "taken in-app, no location fix" : "taken in-app, " + c.shopfront_distance_m + " m from the listing's pin")])
        : el("li", { text: "No shop photo attached" }),
    ]);
    var card = el("div", { className: "card" }, [
      el("h4", { text: c.claimant.name + (c.claimant.area ? " (" + c.claimant.area + ")" : "") + " claims " + c.place.name }),
      el("p", { className: "small-muted", text: placeLine(c.place, c.place_id) + " · filed " + fmtDate(c.created_at) + (c.previously_rejected ? " · second attempt" : "") }),
      proofs,
    ]);
    var acts = el("div", { className: "actions" }, [
      el("button", { className: "button small", text: "Approve", onClick: function () { decide(card, c.tokens.approve, "Approve"); } }),
      el("button", { className: "button quiet small", text: "Reject…", onClick: function () { decide(card, c.tokens.reject, "Reject"); } }),
    ]);
    card.appendChild(acts);
    return card;
  }
  function closureCard(c) {
    var card = el("div", { className: "card" }, [
      el("h4", { text: c.reporter.name + " says " + c.place.name + " has closed" }),
      el("p", { className: "small-muted", text: placeLine(c.place, c.place_id) + " · reported " + fmtDate(c.created_at) + (c.other_reports ? " · " + c.other_reports + " other open report" + (c.other_reports === 1 ? "" : "s") : "") }),
      c.note ? el("p", { text: "“" + c.note + "”" }) : null,
    ]);
    card.appendChild(el("div", { className: "actions" }, [
      el("button", { className: "button danger small", text: "Close place", onClick: function () { decide(card, c.tokens.close, "Close place"); } }),
      el("button", { className: "button quiet small", text: "Dismiss", onClick: function () { decide(card, c.tokens.dismiss, "Dismiss"); } }),
    ]));
    return card;
  }
  function editCard(c) {
    var card = el("div", { className: "card" }, [
      el("h4", { text: c.suggester.name + " suggests an edit to " + c.place.name }),
      el("p", { className: "small-muted", text: placeLine(c.place, c.place_id) + " · suggested " + fmtDate(c.created_at) }),
      c.changes.length ? el("ul", {}, c.changes.map(function (ch) { return el("li", { text: ch.label + " → " + ch.value }); })) : null,
      c.note ? el("p", { text: "“" + c.note + "”" }) : null,
    ]);
    card.appendChild(el("div", { className: "actions" }, [
      el("button", { className: "button small", text: "Done", onClick: function () { decide(card, c.tokens.done, "Mark done"); } }),
      el("button", { className: "button quiet small", text: "Dismiss", onClick: function () { decide(card, c.tokens.dismiss, "Dismiss"); } }),
    ]));
    return card;
  }
  // Preview from the server (what will happen, and any reasons to pick from), then act.
  function decide(card, token, label) {
    var old = card.querySelector(".panel");
    if (old) old.remove();
    var p = el("div", { className: "panel" }, [el("p", { className: "state", text: "Checking…" })]);
    card.appendChild(p);
    call({ op: "moderation.preview", t: token }).then(function (res) {
      p.replaceChildren();
      if (!res.ok) { p.appendChild(el("p", { className: "error", text: res.error })); return; }
      var r = res.data;
      p.appendChild(el("p", { text: r.title, className: "who" }));
      (r.lines || []).forEach(function (line) { p.appendChild(el("p", { text: line })); });
      if (!r.offer) return;
      var form = el("form");

    for (var i = 0; i < 8; i++) s += alphabet[bytes[i] % alphabet.length];
    return "TOOS-" + s.slice(0, 4) + "-" + s.slice(4);
  }
  function toLocalInput(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fromLocalInput(v) { if (!v) return null; var d = new Date(v); return isNaN(d) ? null : d.toISOString(); }

  // ── audit ──────────────────────────────────────────────────────────────────
  function auditView() {
    var a = state.audit;
    var out = [el("h2", { text: "Audit log" }), finder(a, "Find an entry", "admin email, action or target (empty = everything)", loadAudit)];
    if (!a.rows) out.push(el("p", { className: "state", text: "Loading…" }));
    else if (!a.rows.length) out.push(nothing(a, "entry", "entries"));
    else {
      out.push(table(["When", "Who", "What", "Target", "Detail"], a.rows.map(function (e) {
        return el("tr", {}, [el("td", { text: fmtTime(e.at) }), el("td", { text: e.actor }), el("td", { text: e.op }), el("td", {}, [el("code", { text: e.target || "" })]),
          el("td", { className: "small-muted", text: e.detail ? JSON.stringify(e.detail) : "" })]);
      })));
      out.push(pager(a, loadAudit));
    }
    return out;
  }
  function loadAudit() { return loadPage(state.audit, "audit.list"); }

  // ── admins ─────────────────────────────────────────────────────────────────
  function adminsView() {
    var out = [el("h2", { text: "Admins" }), el("p", { className: "state", text: "Anyone listed here can sign in to this page with their Toos account. An admin set in the function's secret cannot be removed from here." })];
    if (!state.admins) return out.concat([el("p", { className: "state", text: "Loading…" })]);
    out.push(table(["Email", "Added by", "Added", ""], state.admins.map(function (a) {
      var removable = !a.fixed && a.email !== state.email;
      return el("tr", {}, [el("td", { text: a.email }), el("td", { text: a.added_by || "" }), el("td", { text: a.added_at ? fmtDate(a.added_at) : "" }),
        el("td", {}, [a.fixed ? el("span", { className: "pill on", text: "fixed" }) : a.email === state.email ? el("span", { className: "pill off", text: "you" }) : removable ? armed("Remove", "Really remove?", function () {
          call({ op: "admins.remove", email: a.email }).then(function (res) { if (!res.ok) return flash(res.error, true); flash("Removed " + a.email + "."); loadTab(); });
        }) : null])]);
    })));
    var email = el("input", { type: "email", name: "email", placeholder: "person@example.com", required: true });
    var form = el("form", { className: "grid2" }, [el("label", {}, ["Add an admin (they need a Toos account under this email)", email]), el("div", { className: "actions" }, [el("button", { type: "submit", className: "button", text: "Add admin" })])]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      call({ op: "admins.add", email: email.value }).then(function (res) { if (!res.ok) return flash(res.error, true); flash("Added " + res.data.email + "."); loadTab(); });
    });
    out.push(form);
    return out;
  }

  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) start(); else showLogin(); });
})();
</script>
